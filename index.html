<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ColorViewer Test</title>

    <style>
      :root {
        --primary: #ff6f61;
        --secondary: #6b5b95;
        --accent: #88b04b;
        --highlight: #f7cac9;
        --dark: #034f84;
        --light: #f0ead6;
      }

      body {
        background-color: var(--light);
        color: var(--dark);
        font-family: "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        gap: 1rem;
      }

      h1 {
        color: var(--primary);
      }

      button {
        background: var(--secondary);
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: 0.3s;
      }

      button:hover {
        background: var(--accent);
      }

      .card {
        background-color: var(--highlight);
        border: 2px solid var(--primary);
        color: var(--dark);
        padding: 1rem 2rem;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
    </style>
  </head>
  <body>
    <h1>🎨 ColorViewer Plugin Test</h1>
    <div class="card">
      <p>
        Testing named colors like <strong>red</strong>, <strong>gold</strong>,
        and <strong>teal</strong>.
      </p>
      <p>
        Also testing HEX values like <strong>#FF6F61</strong>,
        <strong>#6B5B95</strong>, and <strong>#88B04B</strong>.
      </p>
    </div>
    <button>Hover Me</button>
  </body>
</html>
